<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="운동일지">
    <title>스마트 운동일지</title>
    <style>
        :root {
            --primary-color: #007AFF;
            --bg-color: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-color: #000000;
            --secondary-text: #8E8E93;
            --border-color: #E5E5EA;
            --danger-color: #FF3B30;
            --success-color: #34C759;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #0A84FF;
                --bg-color: #000000;
                --card-bg: #1C1C1E;
                --text-color: #FFFFFF;
                --secondary-text: #8E8E93;
                --border-color: #38383A;
                --danger-color: #FF453A;
                --success-color: #30D158;
            }
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
            padding-top: env(safe-area-inset-top);
        }

        header {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px;
            z-index: 100;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            font-weight: 700;
        }

        .date-picker-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        input[type="date"] {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            width: 100%;
        }

        .container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 휴식 타이머 바 */
        .timer-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .timer-display {
            font-size: 28px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--primary-color);
        }

        .timer-btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.7;
        }

        button.secondary {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        button.danger {
            background-color: var(--danger-color);
        }

        /* 총 볼륨 대시보드 */
        .summary-card {
            background: linear-gradient(135deg, var(--primary-color), #5856D6);
            color: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .summary-title {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 4px;
        }

        .summary-value {
            font-size: 32px;
            font-weight: 800;
        }

        /* 운동 항목 카드 */
        .exercise-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .exercise-title {
            font-size: 18px;
            font-weight: 700;
        }

        .set-row {
            display: grid;
            grid-template-columns: 40px 1fr 1fr 50px 30px;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
        }

        .set-label {
            font-size: 14px;
            color: var(--secondary-text);
            font-weight: 600;
        }

        input[type="number"], input[type="text"] {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            text-align: center;
        }

        input[type="text"] {
            text-align: left;
        }

        .check-btn {
            background: var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 8px;
            font-size: 14px;
            width: 100%;
        }

        .check-btn.completed {
            background: var(--success-color);
            color: white;
        }

        .delete-btn {
            background: none;
            color: var(--danger-color);
            padding: 0;
            font-size: 18px;
        }

        .add-set-btn {
            width: 100%;
            margin-top: 8px;
            background: var(--bg-color);
            color: var(--primary-color);
            border: 1px dashed var(--primary-color);
        }

        /* 운동 추가 양식 */
        .add-exercise-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .add-exercise-form {
            display: flex;
            gap: 8px;
        }

        /* 하단 백업 버튼 영역 */
        .backup-area {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .backup-area button {
            flex: 1;
            padding: 12px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏋️ 스마트 운동일지</h1>
        <div class="date-picker-container">
            <input type="date" id="currentDate" onchange="loadDateData()">
        </div>
    </header>

    <div class="container">
        <!-- 타이머 카드 -->
        <div class="timer-card">
            <div>
                <div style="font-size:12px; color:var(--secondary-text);">휴식 타이머</div>
                <div class="timer-display" id="timerDisplay">01:30</div>
            </div>
            <div class="timer-btn-group">
                <button onclick="startTimer(60)">1분</button>
                <button onclick="startTimer(90)">1.5분</button>
                <button onclick="startTimer(120)">2분</button>
                <button class="secondary" onclick="resetTimer()">리셋</button>
            </div>
        </div>

        <!-- 일일 요약 카드 -->
        <div class="summary-card">
            <div class="summary-title">오늘의 총 운동 볼륨</div>
            <div class="summary-value" id="totalVolumeDisplay">0 kg</div>
        </div>

        <!-- 운동 목록 컨테이너 -->
        <div id="exerciseList"></div>

        <!-- 운동 종목 추가 -->
        <div class="add-exercise-card">
            <div style="font-weight:600; margin-bottom:8px;">새 운동 종목 추가</div>
            <div class="add-exercise-form">
                <input type="text" id="newExerciseName" placeholder="예: 스미스 벤치프레스">
                <button onclick="addExercise()">추가</button>
            </div>
        </div>

        <!-- 데이터 백업/복구 버튼 -->
        <div class="backup-area">
            <button class="secondary" onclick="exportData()">💾 기록 내보내기</button>
            <button class="secondary" onclick="document.getElementById('importFile').click()">📂 백업 불러오기</button>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
        </div>
    </div>

    <script>
        let currentDateStr = new Date().toISOString().substring(0, 10);
        let appData = {};
        let timerInterval = null;
        let timerSeconds = 90;

        // 로컬스토리지 동기화 로드
        function initData() {
            try {
                const stored = localStorage.getItem('workoutData');
                if (stored) {
                    appData = JSON.parse(stored);
                }
            } catch (e) {
                console.error('Data load fail', e);
            }
        }

        window.onload = function() {
            initData();
            document.getElementById('currentDate').value = currentDateStr;
            render();
        };

        function loadDateData() {
            currentDateStr = document.getElementById('currentDate').value;
            render();
        }

        function saveData() {
            try {
                localStorage.setItem('workoutData', JSON.stringify(appData));
            } catch (e) {
                alert('저장 공간 오류가 발생했습니다.');
            }
            renderVolume();
        }

        function getTodayExercises() {
            if (!appData[currentDateStr]) {
                appData[currentDateStr] = [];
            }
            return appData[currentDateStr];
        }

        function addExercise() {
            const input = document.getElementById('newExerciseName');
            const name = input.value.trim();
            if (!name) return;

            const exercises = getTodayExercises();
            exercises.push({
                id: Date.now(),
                name: name,
                sets: [
                    { weight: 0, reps: 0, completed: false }
                ]
            });

            input.value = '';
            saveData();
            render();
        }

        function deleteExercise(exId) {
            let exercises = getTodayExercises();
            appData[currentDateStr] = exercises.filter(ex => ex.id !== exId);
            saveData();
            render();
        }

        function addSet(exId) {
            const exercises = getTodayExercises();
            const ex = exercises.find(e => e.id === exId);
            if (ex) {
                const lastSet = ex.sets[ex.sets.length - 1];
                ex.sets.push({
                    weight: lastSet ? lastSet.weight : 0,
                    reps: lastSet ? lastSet.reps : 0,
                    completed: false
                });
                saveData();
                render();
            }
        }

        function deleteSet(exId, setIdx) {
            const exercises = getTodayExercises();
            const ex = exercises.find(e => e.id === exId);
            if (ex && ex.sets.length > 1) {
                ex.sets.splice(setIdx, 1);
                saveData();
                render();
            }
        }

        function updateSet(exId, setIdx, field, value) {
            const exercises = getTodayExercises();
            const ex = exercises.find(e => e.id === exId);
            if (ex && ex.sets[setIdx]) {
                ex.sets[setIdx][field] = field === 'completed' ? value : Number(value);
                saveData();
            }
        }

        function toggleSet(exId, setIdx) {
            const exercises = getTodayExercises();
            const ex = exercises.find(e => e.id === exId);
            if (ex && ex.sets[setIdx]) {
                ex.sets[setIdx].completed = !ex.sets[setIdx].completed;
                saveData();
                render();

                if (ex.sets[setIdx].completed) {
                    startTimer(90);
                }
            }
        }

        function calculateTotalVolume() {
            const exercises = getTodayExercises();
            let totalVolume = 0;

            exercises.forEach(ex => {
                ex.sets.forEach(set => {
                    if (set.completed) {
                        totalVolume += (set.weight * set.reps);
                    }
                });
            });

            return totalVolume;
        }

        function renderVolume() {
            const total = calculateTotalVolume();
            document.getElementById('totalVolumeDisplay').innerText = total.toLocaleString() + ' kg';
        }

        function render() {
            const listContainer = document.getElementById('exerciseList');
            listContainer.innerHTML = '';
            const exercises = getTodayExercises();

            exercises.forEach(ex => {
                const card = document.createElement('div');
                card.className = 'exercise-card';

                let setsHTML = '';
                ex.sets.forEach((set, idx) => {
                    setsHTML += `
                        <div class="set-row">
                            <span class="set-label">${idx + 1}세트</span>
                            <input type="number" placeholder="kg" value="${set.weight || ''}" 
                                oninput="updateSet(${ex.id}, ${idx}, 'weight', this.value)">
                            <input type="number" placeholder="회" value="${set.reps || ''}" 
                                oninput="updateSet(${ex.id}, ${idx}, 'reps', this.value)">
                            <button class="check-btn ${set.completed ? 'completed' : ''}" 
                                onclick="toggleSet(${ex.id}, ${idx})">
                                ${set.completed ? '완료' : '대기'}
                            </button>
                            <button class="delete-btn" onclick="deleteSet(${ex.id}, ${idx})">✕</button>
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="exercise-header">
                        <span class="exercise-title">${ex.name}</span>
                        <button class="delete-btn" onclick="deleteExercise(${ex.id})">삭제</button>
                    </div>
                    ${setsHTML}
                    <button class="add-set-btn" onclick="addSet(${ex.id})">+ 세트 추가</button>
                `;

                listContainer.appendChild(card);
            });

            renderVolume();
        }

        function startTimer(seconds) {
            clearInterval(timerInterval);
            timerSeconds = seconds;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    if (navigator.vibrate) {
                        navigator.vibrate([200, 100, 200]);
                    }
                }
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timerSeconds = 90;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const min = Math.floor(timerSeconds / 60);
            const sec = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        // 백업 데이터 다운로드 (JSON)
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `workout_backup_${currentDateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        // 백업 데이터 불러오기
        function importData(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    appData = JSON.parse(e.target.result);
                    saveData();
                    render();
                    alert('기록을 성공적으로 불러왔습니다!');
                } catch (err) {
                    alert('올바른 백업 파일이 아닙니다.');
                }
            };
            reader.readAsText(event.target.files[0]);
        }
    </script>
</body>
</html>
